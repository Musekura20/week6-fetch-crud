<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>week6-fetch-crud</title>
  </head>
  <body class="bg-gray-100 min-h-screen">
    <main class="max-w-4xl mx-auto px-6 py-10">
      <h1 class="text-3xl font-bold text-gray-800 mb-6">CRUD Posts Manager</h1>

      <p id="status-message" class="text-gray-600 mb-6"></p>

      <div class="mb-6">
        <label for="user-filter" class="block text-gray-700 font-medium mb-2">
          Filter by user
        </label>

        <select
          id="user-filter"
          class="w-full md:w-64 p-3 border border-gray-300 rounded-lg bg-white"
        >
          <option value="">All users (Latest 10 posts)</option>

          <option value="1">User 1</option>
          <option value="2">User 2</option>
          <option value="3">User 3</option>
          <option value="4">User 4</option>
          <option value="5">User 5</option>
          <option value="6">User 6</option>
          <option value="7">User 7</option>
          <option value="8">User 8</option>
          <option value="9">User 9</option>
          <option value="10">User 10</option>
        </select>
      </div>

      <form
        id="create-post-form"
        class="bg-white p-6 rounded-lg shadow-sm mb-8"
      >
        <h2 class="text-xl font-bold text-gray-800 mb-4">Create a New Post</h2>

        <div class="mb-4">
          <label for="post-title" class="block text-gray-700 font-medium mb-2">
            Post Title
          </label>

          <input
            type="text"
            id="post-title"
            name="title"
            placeholder="Enter post title"
            required
            class="w-full p-3 border border-gray-300 rounded-lg"
          />
        </div>

        <div class="mb-4">
          <label for="post-body" class="block text-gray-700 font-medium mb-2">
            Post Body
          </label>

          <textarea
            id="post-body"
            name="body"
            placeholder="Write your post here"
            required
            rows="4"
            class="w-full p-3 border border-gray-300 rounded-lg"
          ></textarea>
        </div>

        <button
          type="submit"
          class="bg-purple-700 text-white px-5 py-3 rounded-lg hover:bg-purple-800"
        >
          Create Post
        </button>
      </form>

      <section
        id="posts-container"
        class="grid grid-cols-1 md:grid-cols-2 gap-5"
      ></section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
